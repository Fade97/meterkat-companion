<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Meterkat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <!-- The lockup comes from brand-lockup.ts; the wordmark is drawn, never typed. -->
    <div id="brand" class="brand"></div>
    <div class="sync">
      <div id="status" class="status" role="status" aria-live="polite"></div>
      <button id="sync" class="btn ghost small" data-action="sync" hidden>Sync now</button>
    </div>
  </header>
  <main id="view"></main>
  <nav id="tabs" class="tabs" aria-label="Sections" hidden>
    <button data-tab="overview">Overview</button>
    <button data-tab="forecast">Forecast</button>
    <button data-tab="phones">Phones</button>
    <button data-tab="settings">Settings</button>
  </nav>
  <script src="app.js"></script>
</body>
</html>
