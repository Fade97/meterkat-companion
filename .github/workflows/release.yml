name: Release
# Builds the single-file Meterkat companion for every target, smoke-tests each binary on a matching runner,
# attests its build provenance and writes SHA256SUMS. Nothing is published from here: tag pushes
# (`companion-v<semver>`) and manual runs upload a `meterkat-companion-release` artifact, which the maintainer
# verifies (including the attestations), signs (Ed25519, key never in CI) and publishes it as a release of this repository
# with scripts/publish-release.ts (docs/releasing.md). Pull requests that touch the build only build and smoke-test.
on:
  push:
    tags: ['companion-v*']
  pull_request:
    paths: ['src/**', 'shared/**', 'scripts/**', '.github/workflows/release.yml', 'package.json', 'pnpm-lock.yaml']
  workflow_dispatch:
    inputs:
      version:
        description: Version embedded in the build (nothing is published)
        default: 0.0.0-dryrun
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  VERSION: ${{ startsWith(github.ref, 'refs/tags/companion-v') && github.ref_name || inputs.version || '0.0.0-dryrun' }}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, os: ubuntu-latest }
          # Cross-built on x64; the smoke test runs it in an arm64 container under QEMU.
          - { target: linux-arm64, os: ubuntu-latest }
          - { target: windows-x64, os: windows-latest }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve version
        run: |
          version="${VERSION#companion-v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "Invalid version $version" >&2; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
          ext=""; [[ "${{ matrix.target }}" == windows-* ]] && ext=".exe"
          echo "BINARY=output/dist/meterkat-companion-$version-${{ matrix.target }}$ext" >> "$GITHUB_ENV"
      - run: pnpm package --target ${{ matrix.target }} --version "$VERSION"
      - name: Smoke test (native)
        if: matrix.target != 'linux-arm64'
        env:
          AI_USAGE_NO_UPDATE: '1'
        run: |
          export AI_USAGE_STATE_DIR="$RUNNER_TEMP/meterkat-state"
          test "$("$BINARY" version | tr -d '\r')" = "$VERSION"
          "$BINARY" inspect
          "$BINARY" setup --dry-run --no-open
          "$BINARY" update status
          "$BINARY" licenses > "$RUNNER_TEMP/notices.txt"
          grep -q "^MIT License" "$RUNNER_TEMP/notices.txt" && grep -q "(embedded runtime)" "$RUNNER_TEMP/notices.txt" && grep -q "^qrcode " "$RUNNER_TEMP/notices.txt"
          "$BINARY" autostart status || true
          # An unknown command must fail with a usage message, not crash.
          if "$BINARY" no-such-command; then exit 1; fi
      - name: Smoke test (arm64 under QEMU)
        if: matrix.target == 'linux-arm64'
        run: |
          docker run --privileged --rm tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0 --install arm64
          docker run --rm --platform linux/arm64 -v "$PWD/output/dist:/dist:ro" -e AI_USAGE_STATE_DIR=/tmp/state -e AI_USAGE_NO_UPDATE=1 debian:12-slim@sha256:7ff6ba31527b9e336162fa061746c366c4b2032f4d2cff2078bea43f78efe3f8 \
            sh -c "test \"\$(/dist/$(basename "$BINARY") version)\" = '$VERSION' && /dist/$(basename "$BINARY") inspect && /dist/$(basename "$BINARY") setup --dry-run --no-open"
      # Signed by GitHub's Sigstore instance for this workflow, ref and commit; publish-release.ts requires it.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: github.event_name != 'pull_request'
        with:
          subject-path: output/dist/meterkat-companion-*
      # Pull requests only build and smoke-test: ~100 MB per binary would exhaust the artifact quota.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name != 'pull_request'
        with:
          name: companion-${{ matrix.target }}
          path: output/dist/meterkat-companion-*
          if-no-files-found: error
          retention-days: 3
  checksums:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: companion-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum meterkat-companion-* > SHA256SUMS
          cat SHA256SUMS
      # Picked up by scripts/publish-release.ts, which verifies, signs and publishes to the releases repository
      # from the maintainer's machine.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: meterkat-companion-release
          path: dist/*
          retention-days: 7
